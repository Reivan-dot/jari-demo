<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JARI - Productos Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #f0f0f0;
      margin: 0;
      padding: 40px;
    }
    h1 { color: #d62828; text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 40px auto;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .card h3 { color: #fff; margin-bottom: 8px; }
    .card p { color: #999; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Catálogo de ejemplo</h1>
  <div class="grid">
    <div class="card"><h3>Faro LED</h3><p>Producto de demostración</p></div>
    <div class="card"><h3>Barra LED</h3><p>Producto de demostración</p></div>
    <div class="card"><h3>Bombilla LED</h3><p>Producto de demostración</p></div>
    <div class="card"><h3>Módulo LED</h3><p>Producto de demostración</p></div>
  </div>
</body>
</html>
